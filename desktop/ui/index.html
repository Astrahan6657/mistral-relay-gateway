<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Mistral Relay Gateway</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f5f7fb;
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .box { text-align: center; padding: 28px; max-width: 440px; }
    .spinner {
      width: 34px; height: 34px; margin: 0 auto 14px;
      border: 3px solid #dbe4f3; border-top-color: #3b5bdb;
      border-radius: 50%; animation: spin .85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { color: #64748b; font-size: 13px; }
    code { color: #3b5bdb; }
    a { color: #2563eb; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <h3>正在启动 Mistral Relay Gateway...</h3>
    <p id="msg">等待本地核心代理 <code>127.0.0.1:8790</code> 就绪</p>
  </div>
  <script>
    const TARGET = "http://127.0.0.1:8790";
    let tries = 0;
    async function poll() {
      tries++;
      try {
        await fetch(`${TARGET}/healthz`, { mode: "no-cors", cache: "no-store" });
        window.location.replace(`${TARGET}/ui`);
        return;
      } catch (_) {}
      if (tries > 25) {
        document.getElementById("msg").innerHTML =
          `核心代理启动较慢，可尝试 <a href="${TARGET}/ui">直接进入控制台</a>，或检查 8790 端口是否被占用。`;
      }
      setTimeout(poll, 350);
    }
    poll();
  </script>
</body>
</html>
