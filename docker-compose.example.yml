services:
  mistral-relay-gateway:
    build: .
    container_name: mistral-relay-gateway
    restart: always
    environment:
      - TZ=Asia/Shanghai
      - HOST=0.0.0.0
      - PORT=8790
      - CONFIG_PATH=/data/config.json
      # Mode 1: Direct Mistral official API (native /v1/responses + strict OpenAPI 3.1.0 chat whitelist)
      - UPSTREAM_MODE=direct_mistral
      - UPSTREAM_BASE=https://api.mistral.ai
      # Mode 2: Sidecar in front of New API / One API (uncomment below and switch UPSTREAM_MODE=new_api)
      # - UPSTREAM_MODE=new_api
      # - UPSTREAM_BASE=http://new-api:3000
      - PASSTHROUGH_AUTH=true
      # Set ADMIN_TOKEN when exposing Web Console (/ui) outside localhost
      - ADMIN_TOKEN=change-me-to-a-strong-random-token
      - STRICT_MISTRAL_WHITELIST=true
      - RESPONSES_MODE=auto
      - NORMALIZE_CONTENT_ARRAYS=true
      - KEEP_IMAGES=4
      - MAX_BODY_BYTES=3145728
      - KEEP_IMAGES_OTHER=8
      - MAX_BODY_BYTES_OTHER=10485760
      - UPSTREAM_TIMEOUT=300
      - CONCURRENCY_WAIT_SECONDS=120
      # Optional: model_name=cap,model2=cap2
      - MODEL_CONCURRENCY_LIMITS=
    ports:
      - "127.0.0.1:8790:8790"
    volumes:
      - ./data:/data
